    <svg width="100" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg" version="1.1">
  <!-- Define star path -->
  <defs>
    <path d="M50,0 21,90 98,35 2,35 79,90z" id="star"></path>
  </defs>

  <!-- Left: evenodd -->
  <clipPath id="emptyStar">
    <use href="#star" clip-rule="evenodd"></use>
  </clipPath>
  <rect clip-path="url(#emptyStar)" width="50" height="90" fill="blue"></rect>

  <!-- Right: nonzero -->
  <clipPath id="filledStar">
    <use href="#star" clip-rule="nonzero"></use>
  </clipPath>
  <rect clip-path="url(#filledStar)" width="50" height="90" x="50" fill="red"></rect>
</svg>
