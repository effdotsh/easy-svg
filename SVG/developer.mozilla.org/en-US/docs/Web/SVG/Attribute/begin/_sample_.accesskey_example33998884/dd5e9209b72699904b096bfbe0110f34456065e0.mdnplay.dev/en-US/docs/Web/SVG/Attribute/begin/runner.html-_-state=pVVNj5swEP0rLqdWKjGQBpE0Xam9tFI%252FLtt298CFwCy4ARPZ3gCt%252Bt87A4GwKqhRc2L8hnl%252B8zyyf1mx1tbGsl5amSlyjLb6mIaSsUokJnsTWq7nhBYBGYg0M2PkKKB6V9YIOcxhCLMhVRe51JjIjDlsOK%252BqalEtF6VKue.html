  <!-- animated rectangles -->
  <rect x="10" y="35" height="15" width="0">
    <animate attributeType="XML" attributeName="width" from="0" to="100" begin="accessKey(s)" dur="8s" fill="freeze"></animate>

  <!-- trigger -->
  <text x="60" y="80" text-anchor="middle" style="pointer-events:none;">
