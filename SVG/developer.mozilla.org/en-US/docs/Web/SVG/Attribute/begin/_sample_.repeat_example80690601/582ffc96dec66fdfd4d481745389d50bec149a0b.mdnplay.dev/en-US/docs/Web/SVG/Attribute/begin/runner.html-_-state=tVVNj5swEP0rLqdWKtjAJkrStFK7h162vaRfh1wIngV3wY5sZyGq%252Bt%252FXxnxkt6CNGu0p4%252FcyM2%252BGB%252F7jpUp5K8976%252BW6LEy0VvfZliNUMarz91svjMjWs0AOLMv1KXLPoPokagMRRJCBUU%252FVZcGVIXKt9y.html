    <svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- animated rectangle -->
  <rect x="10" y="35" height="15" width="0">
    <animate attributeType="XML" attributeName="width" from="0" to="100" id="myLoop" begin="0s;myLoop.end" dur="4s" repeatCount="3"></animate>

    <set attributeType="CSS" attributeName="fill" to="green" begin="myLoop.begin"></set>

    <set attributeType="CSS" attributeName="fill" to="gold" begin="myLoop.repeat(1)"></set>

    <set attributeType="CSS" attributeName="fill" to="red" begin="myLoop.repeat(2)"></set>
  </rect>

  <!-- grid -->
  <text x="10" y="20" text-anchor="middle">0s</text>
  <line x1="10" y1="25" x2="10" y2="55" stroke="grey" stroke-width=".5"></line>
  <text x="35" y="20" text-anchor="middle">1s</text>
  <line x1="35" y1="25" x2="35" y2="55" stroke="grey" stroke-width=".5"></line>
  <text x="60" y="20" text-anchor="middle">2s</text>
  <line x1="60" y1="25" x2="60" y2="55" stroke="grey" stroke-width=".5"></line>
  <text x="85" y="20" text-anchor="middle">3s</text>
  <line x1="85" y1="25" x2="85" y2="55" stroke="grey" stroke-width=".5"></line>
  <text x="110" y="20" text-anchor="middle">4s</text>
  <line x1="110" y1="25" x2="110" y2="55" stroke="grey" stroke-width=".5"></line>

  <line x1="10" y1="30" x2="110" y2="30" stroke="grey" stroke-width=".5"></line>
  <line x1="10" y1="55" x2="110" y2="55" stroke="grey" stroke-width=".5"></line>
</svg>
