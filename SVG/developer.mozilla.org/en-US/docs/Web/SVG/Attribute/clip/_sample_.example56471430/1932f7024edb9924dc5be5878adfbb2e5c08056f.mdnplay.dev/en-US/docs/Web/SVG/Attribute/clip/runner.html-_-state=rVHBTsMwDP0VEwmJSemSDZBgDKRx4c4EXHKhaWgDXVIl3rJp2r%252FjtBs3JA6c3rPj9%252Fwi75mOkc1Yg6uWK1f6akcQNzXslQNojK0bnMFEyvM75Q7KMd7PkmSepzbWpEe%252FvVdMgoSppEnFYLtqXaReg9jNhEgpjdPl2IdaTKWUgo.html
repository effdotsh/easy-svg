  <!-- Auto clipping -->
  <svg x="0" width="10" height="10" clip="auto">
    <circle cx="5" cy="5" r="4" stroke="green"></circle>
  </svg>

  <!-- Rect(top, right, bottom, left) clipping -->

  </svg>
