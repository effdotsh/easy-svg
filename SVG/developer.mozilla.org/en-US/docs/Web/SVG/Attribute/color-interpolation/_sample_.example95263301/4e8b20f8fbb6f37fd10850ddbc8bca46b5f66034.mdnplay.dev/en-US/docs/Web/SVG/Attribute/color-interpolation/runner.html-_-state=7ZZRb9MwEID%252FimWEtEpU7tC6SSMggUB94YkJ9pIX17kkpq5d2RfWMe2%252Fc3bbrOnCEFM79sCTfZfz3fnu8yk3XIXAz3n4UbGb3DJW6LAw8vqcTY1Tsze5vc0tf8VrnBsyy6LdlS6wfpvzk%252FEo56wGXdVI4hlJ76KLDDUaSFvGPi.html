    <svg width="450" height="70">
  <title>
    Example of linearGradient excluding the color-interpolation attribute
  </title>
  <defs>
    <linearGradient id="gradientDefault">
      <stop offset="0%" stop-color="white"></stop>
      <stop offset="25%" stop-color="blue"></stop>
      <stop offset="50%" stop-color="white"></stop>
      <stop offset="75%" stop-color="red"></stop>
      <stop offset="100%" stop-color="white"></stop>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="400" height="40" fill="url(#gradientDefault)" stroke="black"></rect>
  <text x="0" y="60" font-family="courier" font-size="16">
    color-interpolation not set
  </text>
</svg>

<svg width="450" height="70">
  <title>
    Example of linearGradient using the color-interpolation attribute
  </title>
  <defs>
    <linearGradient id="gradientLinearRGB" color-interpolation="linearRGB">
      <stop offset="0%" stop-color="white"></stop>
      <stop offset="25%" stop-color="blue"></stop>
      <stop offset="50%" stop-color="white"></stop>
      <stop offset="75%" stop-color="red"></stop>
      <stop offset="100%" stop-color="white"></stop>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="400" height="40" fill="url(#gradientLinearRGB)" stroke="black"></rect>
  <text x="0" y="60" font-family="courier" font-size="16">
    color-interpolation="linearRGB"
  </text>
</svg>

<svg width="450" height="70">
  <title>
    Example of radialGradient excluding the color-interpolation attribute
  </title>
  <defs>
    <radialGradient id="none">
      <stop offset="0%" stop-color="red"></stop>
      <stop offset="100%" stop-color="gold"></stop>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="400" height="40" fill="url(#none)" stroke="black"></rect>
  <text x="0" y="60" font-family="courier" font-size="16">
    color-interpolation not set
  </text>
</svg>

<svg width="450" height="70">
  <title>
    Example of radialGradient using the color-interpolation attribute
  </title>
  <defs>
    <radialGradient id="radLinearRGB" color-interpolation="linearRGB">
      <stop offset="0%" stop-color="red"></stop>
      <stop offset="100%" stop-color="gold"></stop>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="400" height="40" fill="url(#radLinearRGB)" stroke="black"></rect>
  <text x="0" y="60" font-family="courier" font-size="16">
    color-interpolation="linearRGB" (SVG attr)
  </text>
</svg>
