    <svg viewBox="0 -1 10 7" xmlns="http://www.w3.org/2000/svg">
  <!-- Effect of the "miter" value -->
  <path d="M1,5 l2,-3 l2,3" stroke="black" fill="none" stroke-linejoin="miter"></path>

  <!-- Effect of the "miter" value on a sharp angle
       where de default miter limit is exceeded -->
  <path d="M7,5 l0.75,-3 l0.75,3" stroke="black" fill="none" stroke-linejoin="miter"></path>

  <!-- the following red dotted line show where
       the miter value falls back to the bevel value -->
  <path d="M0,0 h10" stroke="red" stroke-dasharray="0.05" stroke-width="0.025"></path>

  <!-- the following pink lines highlight the position of the path for each stroke -->
  <g>
    <path d="M1,5 l2,-3 l2,3" stroke="pink" fill="none" stroke-width="0.025"></path>
    <circle cx="1" cy="5" r="0.05" fill="pink"></circle>
    <circle cx="3" cy="2" r="0.05" fill="pink"></circle>
    <circle cx="5" cy="5" r="0.05" fill="pink"></circle>

    <path d="M7,5 l0.75,-3 l0.75,3" stroke="pink" fill="none" stroke-width="0.025"></path>
    <circle cx="7" cy="5" r="0.05" fill="pink"></circle>
    <circle cx="7.75" cy="2" r="0.05" fill="pink"></circle>
    <circle cx="8.5" cy="5" r="0.05" fill="pink"></circle>
  </g>
</svg>
