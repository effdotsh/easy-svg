    <svg width="8cm" height="4cm" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" version="1.1">
  <title>Examples of feComponentTransfer operations</title>
  <desc>
    Text strings showing the effects of the slope attribute of the
    feComponentTransfer filter function linear options.
  </desc>
  <defs>
    <linearGradient id="MyGradient" gradientUnits="userSpaceOnUse" x1="100" y1="0" x2="600" y2="0">
      <stop offset="0" stop-color="#ff0000"></stop>
      <stop offset="1" stop-color="#0000ff"></stop>
    </linearGradient>
    <filter id="Linear1" filterUnits="objectBoundingBox" x="0%" y="0%" width="100%" height="100%">
      <feComponentTransfer>
        <feFuncR type="linear" slope="1"></feFuncR>
        <feFuncG type="linear" slope="1"></feFuncG>
        <feFuncB type="linear" slope="1"></feFuncB>
      </feComponentTransfer>
    </filter>
    <filter id="Linear2" filterUnits="objectBoundingBox" x="0%" y="0%" width="100%" height="100%">
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.5"></feFuncR>
        <feFuncG type="linear" slope="2.5"></feFuncG>
        <feFuncB type="linear" slope="5"></feFuncB>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect fill="none" stroke="blue" x="1" y="1" width="798" height="398"></rect>
  <g font-family="Verdana" font-size="100" font-weight="bold" fill="url(#MyGradient)">
    <text x="100" y="190" filter="url(#Linear1)">Slope1</text>
    <text x="100" y="290" filter="url(#Linear2)">Slope2</text>
  </g>
</svg>
