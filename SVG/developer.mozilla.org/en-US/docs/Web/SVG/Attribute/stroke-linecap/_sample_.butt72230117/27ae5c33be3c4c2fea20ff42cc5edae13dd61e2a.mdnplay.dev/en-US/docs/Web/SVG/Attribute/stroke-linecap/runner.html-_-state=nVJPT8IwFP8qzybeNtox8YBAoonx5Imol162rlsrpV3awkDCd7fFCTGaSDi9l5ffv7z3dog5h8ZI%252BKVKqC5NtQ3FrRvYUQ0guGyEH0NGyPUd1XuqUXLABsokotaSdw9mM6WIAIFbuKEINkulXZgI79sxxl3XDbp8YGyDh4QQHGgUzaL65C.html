    <svg viewBox="0 0 6 4" xmlns="http://www.w3.org/2000/svg">
  <!-- Effect of the "butt" value -->
  <path d="M1,1 h4" stroke="black" stroke-linecap="butt"></path>

  <!-- Effect of the "butt" value on a zero length path -->
  <path d="M3,3 h0" stroke="black" stroke-linecap="butt"></path>

  <!--
  the following pink lines highlight the
  position of the path for each stroke
  -->
  <path d="M1,1 h4" stroke="pink" stroke-width="0.025"></path>
  <circle cx="1" cy="1" r="0.05" fill="pink"></circle>
  <circle cx="5" cy="1" r="0.05" fill="pink"></circle>
  <circle cx="3" cy="3" r="0.05" fill="pink"></circle>
</svg>
