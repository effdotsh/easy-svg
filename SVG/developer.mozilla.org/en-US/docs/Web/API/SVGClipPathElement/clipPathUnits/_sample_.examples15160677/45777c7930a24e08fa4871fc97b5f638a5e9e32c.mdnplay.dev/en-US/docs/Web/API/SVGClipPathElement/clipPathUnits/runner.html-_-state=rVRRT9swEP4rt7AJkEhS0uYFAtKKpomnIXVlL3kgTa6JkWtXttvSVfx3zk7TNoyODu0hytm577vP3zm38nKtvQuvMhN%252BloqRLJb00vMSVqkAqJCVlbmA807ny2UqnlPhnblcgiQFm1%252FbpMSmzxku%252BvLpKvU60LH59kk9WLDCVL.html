    <div>
  <svg viewBox="0 0 100 100" width="200" height="200">
    <clipPath id="clip1" clipPathUnits="userSpaceOnUse">
      <circle cx="50" cy="50" r="35"></circle>
    </clipPath>

    <clipPath id="clip2" clipPathUnits="objectBoundingBox">
      <circle cx=".5" cy=".5" r=".35"></circle>
    </clipPath>

    <!-- Some reference rect to materialized to clip path -->
    <rect id="r1" x="0" y="0" width="45" height="45"></rect>
    <rect id="r2" x="0" y="55" width="45" height="45"></rect>
    <rect id="r3" x="55" y="55" width="45" height="45"></rect>
    <rect id="r4" x="55" y="0" width="45" height="45"></rect>

    <!-- The first 3 rect are clipped with userSpaceOnUse units -->
    <use clip-path="url(#clip1)" href="#r1" fill="red"></use>
    <use clip-path="url(#clip1)" href="#r2" fill="blue"></use>
    <use clip-path="url(#clip1)" href="#r3" fill="yellow"></use>

    <!-- The last rect is clipped with objectBoundingBox units -->
    <use clip-path="url(#clip2)" href="#r4" fill="green"></use>
  </svg>
