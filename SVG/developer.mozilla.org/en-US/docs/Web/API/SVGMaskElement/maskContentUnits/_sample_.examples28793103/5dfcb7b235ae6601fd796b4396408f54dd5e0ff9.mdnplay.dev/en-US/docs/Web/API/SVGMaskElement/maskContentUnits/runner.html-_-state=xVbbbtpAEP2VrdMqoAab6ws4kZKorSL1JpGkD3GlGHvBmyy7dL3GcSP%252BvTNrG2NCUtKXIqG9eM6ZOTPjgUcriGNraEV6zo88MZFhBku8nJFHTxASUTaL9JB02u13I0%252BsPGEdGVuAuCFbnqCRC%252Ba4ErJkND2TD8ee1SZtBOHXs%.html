    <div>
  <svg viewBox="0 0 100 100" width="150" height="150" xmlns="http://www.w3.org/2000/svg">
    <mask id="mask1" maskContentUnits="userSpaceOnUse">
      <rect fill="black" x="0" y="0" width="100%" height="100%"></rect>
      <circle fill="white" cx="50" cy="50" r="35"></circle>
    </mask>

    <mask id="mask2" maskContentUnits="objectBoundingBox">
      <rect fill="black" x="0" y="0" width="100%" height="100%"></rect>
      <circle fill="white" cx=".5" cy=".5" r=".35"></circle>
      <animate attributeName="maskContentUnits" values="objectBoundingBox;userSpaceOnUse" dur="1s" repeatCount="indefinite"></animate>
    </mask>

    <!-- Some reference rect to materialized the mask -->
    <rect id="r1" x="0" y="0" width="45" height="45"></rect>
    <rect id="r2" x="0" y="55" width="45" height="45"></rect>
    <rect id="r3" x="55" y="55" width="45" height="45"></rect>
    <rect id="r4" x="55" y="0" width="45" height="45"></rect>

    <!-- The first 3 rect are masked with useSpaceOnUse units -->
    <use mask="url(#mask1)" href="#r1" fill="blue"></use>
    <use mask="url(#mask1)" href="#r2" fill="yellow"></use>
    <use mask="url(#mask1)" href="#r3" fill="green"></use>

    <!-- The last rect is masked with objectBoundingBox units -->
    <use mask="url(#mask2)" href="#r4" fill="lightblue"></use>
  </svg>
</div>
